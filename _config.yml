title: "Yeonchaking Blog"
description: "Android portfolio and career transition site"
url: "https://yeonchaking.github.io"
repository: "yeonchaking/yeonchaking.github.io"
locale: "ko-KR"
timezone: "Asia/Seoul"

include:
  - _pages

remote_theme: "mmistakes/minimal-mistakes@4.24.0"

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-include-cache

markdown: kramdown
paginate: 5
paginate_path: "/page:num/"

collections:
  posts:
    output: true
    permalink: /:categories/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

author:
  name: "Yeon Je Gyeong"
  bio: "Android Developer"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yeonchaking"
    - label: "Blog"
      icon: "fas fa-fw fa-link"
      url: "https://gtking.tistory.com/"

social:
  type: "Person"
  name: "Yeon Je Gyeong"
  links:
    - "https://github.com/yeonchaking"
    - "https://gtking.tistory.com/"

sass:
  sass_dir: _sass
  style: compressed
