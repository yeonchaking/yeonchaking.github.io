title: "연제경 | Android Developer"
description: "공공·교통 현장의 Android 앱을 개발하는 연제경의 포트폴리오"
url: "https://yeonchaking.github.io"
locale: "ko-KR"
timezone: "Asia/Seoul"

include:
  - _pages

remote_theme: "mmistakes/minimal-mistakes@4.24.0"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-include-cache

markdown: kramdown
paginate: 5
paginate_path: "/page:num/"

collections:
  posts:
    output: true
    permalink: /:categories/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

author:
  name: "연제경"
  bio: "Android Developer"
  avatar: "/assets/images/bio-photo.jpg"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:yllh325@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yeonchaking"
    - label: "Blog"
      icon: "fas fa-fw fa-link"
      url: "https://nockcha-log.tistory.com/"

social:
  type: "Person"
  name: "연제경"
  links:
    - "https://github.com/yeonchaking"
    - "https://nockcha-log.tistory.com/"

sass:
  sass_dir: _sass
  style: compressed
